name: Agent Metadata

permissions:
  contents: read

on:
  # Allows manual triggering with parameters
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (needs to exactly match the GH tag for the release)"
        required: true
        type: string
      agent-type:
        description: "Agent type"
        required: false
        default: "NRPythonAgent"
        type: string
      git-ref:
        description: "Git ref (tag, branch, or SHA) to read .fleetControl from. Defaults to the version tag."
        required: false
        default: ""
        type: string
      use-cache:
        description: "Use cache"
        required: false
        default: true
        type: boolean

  # Allows calling from another workflow
  workflow_call:
    inputs:
      version:
        description: "Version tag (needs to exactly match the GH tag for the release)"
        required: true
        type: string
      agent-type:
        description: "Agent type"
        required: false
        default: "NRPythonAgent"
        type: string
      git-ref:
        description: "Git ref (tag, branch, or SHA) to read .fleetControl from. Defaults to the version tag."
        required: false
        default: ""
        type: string
      use-cache:
        description: "Use cache"
        required: false
        default: true
        type: boolean
    secrets:
      FC_SYS_ID_CLIENT_ID:
        required: true
      FC_SYS_ID_PR_KEY:
        required: true
      AGENT_METADATA_ACTION_LICENSE_KEY:
        required: false

jobs:
  send-agent-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Send agent metadata
        uses: newrelic/agent-metadata-action/send-metadata@39a73d441e2787d13d4de26b1f437025cc34dcc7 # v1.7.1
        with:
          newrelic-client-id: ${{ secrets.FC_SYS_ID_CLIENT_ID }}
          newrelic-private-key: ${{ secrets.FC_SYS_ID_PR_KEY }}
          newrelic-license-key: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }} # action owning team license key
          agent-type: ${{ inputs.agent-type }}
          version: ${{ inputs.version }}
          git-ref: ${{ inputs.git-ref }}
          cache: ${{ inputs.use-cache }}
          monitoring-type: "APM"
