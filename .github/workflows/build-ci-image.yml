---
name: Build CI Image

on:
  workflow_dispatch: # Allow manual trigger
  schedule:
    - cron: "15 16 * * 0" # At 16:15 UTC on Sunday
  pull_request: # Trigger test builds on pull requests, but only when relevant files change.
    paths:
      - ".github/containers/ci/**"
      - ".github/workflows/build-ci-image.yml"
    branches:
      - main
  push: # Trigger rebuilds when pushing relevant files to main.
    paths:
      - ".github/containers/ci/**"
      - ".github/workflows/build-ci-image.yml"
    branches:
      - main
    # Do not run when a tag is created.
    tags-ignore:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            cache_tag: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            cache_tag: linux-arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    name: Docker Build ${{ matrix.platform }}
    permissions:
      contents: read
      packages: write # Push images to GitHub Container Registry

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Lowercase image name and append -ci
      - name: Generate Image Name
        id: image-name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}-ci" >>"${GITHUB_OUTPUT}"

      - name: Generate Docker Metadata (Tags and Labels)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ steps.image-name.outputs.IMAGE_NAME }}
          flavor: |
            prefix=
            suffix=
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYY-MM-DD'}}
            type=sha,format=short,prefix=sha-
            type=sha,format=long,prefix=sha-
            type=ref,event=pr

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image by Digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .github/containers/ci
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ steps.image-name.outputs.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export Digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload Digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ matrix.cache_tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build

    name: Docker Merge Image
    permissions:
      contents: read
      packages: write # Push images to GitHub Container Registry

    steps:
      - name: Download Digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Lowercase image name and append -ci
      - name: Generate Image Name
        id: image-name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}-ci" >>"${GITHUB_OUTPUT}"

      - name: Generate Docker Metadata (Tags and Labels)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ steps.image-name.outputs.IMAGE_NAME }}
          flavor: |
            prefix=
            suffix=
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYY-MM-DD'}}
            type=sha,format=short,prefix=sha-
            type=sha,format=long,prefix=sha-
            type=ref,event=pr

      - name: Create Manifest List and Push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "ghcr.io/${IMAGE_NAME}@sha256:%s " *)
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.IMAGE_NAME }}

      - name: Inspect Image
        run: |
          docker buildx imagetools inspect "ghcr.io/${IMAGE_NAME}:${IMAGE_VERSION}"
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
