---
name: Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release # Only one release run happens at a time
  cancel-in-progress: false

jobs:
  validate:
    name: Validate agent config schema version
    runs-on: ubuntu-24.04
    # Runs before anything is built or published. The Fleet Control backend
    # rejects metadata whose schema changed without a version bump, but that
    # happens in update-agent-metadata, after PyPI is already published.
    # The schema itself is still only registered after publish succeeds.

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Check schema version was bumped since previous release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match='v*' "${RELEASE_TAG}^")
          echo "Comparing against previous release tag: ${prev}"
          python3 .fleetControl/schemaGeneration/bump-schema-version.py --since="${prev}"

  build-wheels-linux:
    name: Build wheels for ${{ matrix.python }}-linux_${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314, cp314t]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          # Builds both manylinux and musllinux for this Python version.
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_ARCHS_LINUX: native
          # Constrain build and test dependencies from a hash-locked file.
          CIBW_BUILD_FRONTEND: "build; args: --dependency-constraints-txt=.github/requirements/release-build.txt"
          CIBW_BEFORE_TEST: "python -m pip install --require-hashes -r {project}/.github/requirements/release-test.txt"
          CIBW_TEST_COMMAND_LINUX: "export PYTHONPATH={project}/tests; pytest {project}/tests/agent_unittests -vx"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-linux-${{ matrix.python }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  build-wheels-windows:
    name: Build wheels for ${{ matrix.python }}-win_${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [cp313, cp314, cp314t]
        arch: [amd64, arm64]
        include:
          - arch: AMD64
            runner: windows-2025
          - arch: ARM64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_ARCHS_WINDOWS: native
          # Constrain build and test dependencies from a hash-locked file.
          CIBW_BUILD_FRONTEND: "build; args: --dependency-constraints-txt=.github/requirements/release-build.txt"
          CIBW_BEFORE_TEST: "python -m pip install --require-hashes -r {project}/.github/requirements/release-test.txt"
          CIBW_TEST_COMMAND_WINDOWS: "set PYTHONPATH={project}/tests; pytest {project}/tests/agent_unittests -vx"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-windows-${{ matrix.python }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  build-sdist:
    name: Build sdist
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install --require-hashes -r .github/requirements/release-build.txt

      - name: Build Source Package
        run: |
          pyproject-build --sdist --dependency-constraints-txt=.github/requirements/release-build.txt

      - name: Prepare Checksum Files
        working-directory: ./dist
        run: |
          tarball="$(basename ./*.tar.gz)"
          openssl md5 -binary "${tarball}" | xxd -p | tr -d '\n' > "${tarball}.md5"
          sha256sum "${tarball}" > "${tarball}.sha256"

      - name: Upload Source Package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      # Kept separate so the PyPI upload only ever sees distributions.
      - name: Upload Checksum Files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist-checksums
          path: |
            ./dist/*.tar.gz.md5
            ./dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs:
      - validate
      - build-wheels-linux
      - build-wheels-windows
      - build-sdist
    runs-on: ubuntu-24.04
    environment: ${{ matrix.pypi-instance }}
    permissions:
      contents: write # Publish artifacts to Github releases
      id-token: write # Sign attestations, and PyPI trusted publishing
      attestations: write # Create build provenance attestations
      artifact-metadata: write # Record artifact metadata for attestations

    strategy:
      matrix:
        pypi-instance:
          - pypi
          # Valid values for deployment are:
          # - "pypi" for production
          # - "testpypi" for testing
          # - "build-only" to skip publishing and only test builds.

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: ./dist/
          merge-multiple: true

      # Kept out of ./dist, since the PyPI upload takes everything in it.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sdist-checksums
          path: ./checksums/

      - name: Attest
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            ./dist/*.whl
            ./dist/*.tar.gz

      - name: Upload Package to S3
        if: matrix.pypi-instance == 'pypi'
        run: |
          tarball="$(basename ./dist/*.tar.gz)"
          aws s3 cp "./checksums/${tarball}.md5" "${S3_DST}/${tarball}.md5"
          aws s3 cp "./checksums/${tarball}.sha256" "${S3_DST}/${tarball}.sha256"
          aws s3 cp "./dist/${tarball}" "${S3_DST}/${tarball}"
        env:
          S3_DST: s3://nr-downloads-main/python_agent/release
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2

      - name: Upload assets to draft release
        run: |
          gh release upload "${TAG}" --repo="${GITHUB_REPOSITORY}" --clobber ./dist/*
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload Package to PyPI
        if: matrix.pypi-instance == 'pypi'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          # skip-existing lets a re-run finish an upload that stopped partway.
          skip-existing: true

      - name: Upload Package to TestPyPI
        if: matrix.pypi-instance == 'testpypi'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # skip-existing lets a re-run finish an upload that stopped partway.
          skip-existing: true

      - name: Wait for release to be available
        if: matrix.pypi-instance == 'pypi'
        id: wait
        run: |
          sleep 60

      - name: Create release tags for Lambda and K8s Init Containers
        if: matrix.pypi-instance == 'pypi'
        run: |
          RELEASE_TITLE="New Relic Python Agent ${GITHUB_REF_NAME}.0"
          RELEASE_TAG="${GITHUB_REF_NAME}.0_python"
          RELEASE_NOTES="Automated release for [Python Agent ${GITHUB_REF_NAME}](https://github.com/newrelic/newrelic-python-agent/releases/tag/${GITHUB_REF_NAME})"
          echo "newrelic/newrelic-lambda-layers - Releasing \"${RELEASE_TITLE}\" with tag ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" --title="${RELEASE_TITLE}" --repo=newrelic/newrelic-lambda-layers --notes="${RELEASE_NOTES}"
          echo "newrelic/newrelic-agent-init-container - Releasing \"${RELEASE_TITLE}\" with tag ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" --title="${RELEASE_TITLE}" --repo=newrelic/newrelic-agent-init-container --notes="${RELEASE_NOTES}"
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

  update-agent-metadata:
    needs: [publish]
    permissions:
      contents: read
    uses: ./.github/workflows/agent-metadata.yml # zizmor: ignore[self-repository] $/ syntax not yet supported by MegaLinter tooling
    with:
      version: ${{ github.ref_name }}
      agent-type: "NRPythonAgent"
    secrets:
      FC_SYS_ID_CLIENT_ID: ${{ secrets.FC_SYS_ID_CLIENT_ID }}
      FC_SYS_ID_PR_KEY: ${{ secrets.FC_SYS_ID_PR_KEY }}
      AGENT_METADATA_ACTION_LICENSE_KEY: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }}
