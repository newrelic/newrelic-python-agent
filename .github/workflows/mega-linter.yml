---
# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
name: MegaLinter

on: # yamllint disable-line rule:truthy - false positive
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APPLY_FIXES: all
  APPLY_FIXES_EVENT: pull_request
  APPLY_FIXES_MODE: commit

concurrency:
  group: ${{ github.ref || github.run_id }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Commit and push applied linter fixes
      issues: write # Post linter reports as comments
      pull-requests: write # Post linter reports on PRs
    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Required for pushing commits to PRs
          persist-credentials: false

      # MegaLinter
      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/python@v10.2.0
        env:
          # All available variables are described in documentation
          # https://megalinter.io/latest/configuration/
          VALIDATE_ALL_CODEBASE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ADD YOUR CUSTOM ENV VARIABLES HERE OR DEFINE THEM IN A FILE
          # .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY
          GITHUB_COMMENT_REPORTER: "true"
          PYTHON_RUFF_ARGUMENTS: --config pyproject.toml --config 'output-format="github"'
          PYTHON_RUFF_FORMAT_ARGUMENTS: --config pyproject.toml --config 'output-format="github"'

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log

      # Set APPLY_FIXES_IF var for use in future steps
      - name: Set APPLY_FIXES_IF var
        env:
          APPLY_FIXES_IF: >-
            ${{
              steps.ml.outputs.has_updated_sources == 1 &&
              (
                env.APPLY_FIXES_EVENT == 'all' ||
                env.APPLY_FIXES_EVENT == github.event_name
              ) &&
              (
                github.event_name == 'push' ||
                github.event.pull_request.head.repo.full_name == github.repository
              )
            }}
        run: |
          printf 'APPLY_FIXES_IF=%s\n' "${APPLY_FIXES_IF}" >> "${GITHUB_ENV}"

      # Set APPLY_FIXES_IF_* vars for use in future steps
      - name: Set APPLY_FIXES_IF_* vars
        env:
          APPLY_FIXES_IF_PR: >-
            ${{
              env.APPLY_FIXES_IF == 'true' &&
              env.APPLY_FIXES_MODE == 'pull_request'
            }}
          APPLY_FIXES_IF_COMMIT: >-
            ${{
              env.APPLY_FIXES_IF == 'true' &&
              env.APPLY_FIXES_MODE == 'commit' &&
              (!contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref))
            }}
        run: |
          printf 'APPLY_FIXES_IF_PR=%s\n' "${APPLY_FIXES_IF_PR}" >> "${GITHUB_ENV}"
          printf 'APPLY_FIXES_IF_COMMIT=%s\n' "${APPLY_FIXES_IF_COMMIT}" >> "${GITHUB_ENV}"

      - name: Prepare commit
        if: env.APPLY_FIXES_IF_COMMIT == 'true'
        run: sudo chown -Rc $UID .git/

      - name: Commit and push applied linter fixes
        if: env.APPLY_FIXES_IF_COMMIT == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          GIT_USER_NAME: github-actions[bot]
          GIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # Checkout is on the detached PR merge commit; move the uncommitted
          # fixes onto the PR head branch so main isn't pushed into it.
          git checkout "$HEAD_REF" --
          git add .
          if git diff --staged --quiet; then
            echo "Working tree clean. Nothing to commit."
            exit 0
          fi
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git commit -m "[MegaLinter] Apply linters fixes" \
            --author="$ACTOR <$ACTOR_ID+$ACTOR@users.noreply.github.com>"
          gh auth setup-git
          git push origin "HEAD:$HEAD_REF"
