# Adapted from https://github.com/github/gh-actions-lock/blob/90ae563599cf303ff91eb5b46277ff04f5d2b4fc/.github/workflows/verify-lockfile.yml

# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream.

name: Verify Actions Lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.ref || github.run_id }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Actions Lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Pinned extension tag is immutable, hash not required
      - run: gh extension install github/gh-actions-lock --pin v0.4.1

      # Offline coverage check of every workflow, including trivy.yml.
      - name: Verify lockfile coverage (offline)
        run: gh actions-lock --verify-local

      # trivy.yml is skipped here because Trivy blocks the network access
      # needed to verify its pins upstream. It is still covered by the
      # offline check above.
      - name: Verify lockfile pins upstream (except trivy.yml)
        run: |
          status=0
          for f in .github/workflows/*.yml; do
            [ "$(basename "$f")" = "trivy.yml" ] && continue
            echo "::group::$f"
            gh actions-lock --verify "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
